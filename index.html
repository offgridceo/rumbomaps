<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rumbo Maps — Official CDMX Transit Network</title>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet Library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161a22;
      --card-border: #262c3a;
      --accent-coral: #ff5e57;
      --accent-teal: #00d2d3;
      --accent-amber: #ff9f43;
      --text-main: #f1f2f6;
      --text-muted: #8c9baf;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    /* Glassmorphic Nav Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(13, 15, 18, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-coral);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-teal);
    }

    /* Dashboard Layout */
    .dashboard-container {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 20px;
    }

    .section-label {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pinned-card {
      background: linear-gradient(135deg, rgba(22, 26, 34, 0.95), rgba(30, 36, 48, 0.95));
      border: 1px solid var(--accent-coral);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 12px 32px rgba(255, 94, 87, 0.12);
      position: relative;
    }

    .pinned-badge {
      position: absolute;
      top: -12px;
      right: 20px;
      background: var(--accent-coral);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .pinned-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pinned-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .open-map-btn {
      background: var(--accent-coral);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .open-map-btn:hover { opacity: 0.9; }

    /* Map View Container */
    .map-interface {
      display: none;
      height: calc(100vh - 61px);
      position: relative;
      flex-direction: column;
    }

    /* Transit Mode Tabs */
    .mode-tab-bar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
      z-index: 500;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-coral);
      color: #fff;
      border-color: var(--accent-coral);
    }

    /* System Schedule Banner */
    .info-drawer {
      background: rgba(22, 26, 34, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 16px;
      font-size: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 499;
    }

    .schedule-badges { display: flex; gap: 12px; flex-wrap: wrap; }
    .badge { background: rgba(0, 0, 0, 0.3); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--card-border); }
    .badge-label { color: var(--text-muted); font-size: 0.72rem; display: block; }
    .badge-time { font-weight: 700; color: var(--accent-teal); }

    .official-link {
      color: var(--accent-amber);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(255, 159, 67, 0.1);
      border-radius: 8px;
    }

    #map {
      flex: 1;
      width: 100%;
      background: #ffffff; /* Clean white canvas for official SEMOVI diagram */
      z-index: 100;
    }

    .gps-btn {
      position: absolute;
      bottom: 24px;
      right: 20px;
      z-index: 600;
      background: var(--accent-coral);
      color: #fff;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(255, 94, 87, 0.4);
      cursor: pointer;
    }

    .user-location-dot {
      width: 18px;
      height: 18px;
      background-color: var(--accent-coral);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 94, 87, 0.8);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 94, 87, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(255, 94, 87, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 94, 87, 0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="logo" onclick="showDashboard()">
        <i data-lucide="compass"></i>
        <span>Rumbo Maps</span>
      </div>
      <div class="nav-actions">
        <button class="nav-btn" id="backDashBtn" onclick="showDashboard()" style="display: none;">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Dashboard -->
  <div id="dashboardView" class="dashboard-container">
    <div class="section-label">
      <i data-lucide="pin" size="14" style="color:var(--accent-coral)"></i>
      <span>Active Capital Network</span>
    </div>

    <div class="pinned-card">
      <span class="pinned-badge">PINNED</span>
      <div class="pinned-title">Mexico City (CDMX)</div>
      <div class="pinned-sub">Official SEMOVI Schematic Network Diagram — High-Resolution Vector Viewer</div>
      <button class="open-map-btn" onclick="openCityMap('cdmx')">
        <i data-lucide="map" size="18"></i> Open Official Diagram Map
      </button>
    </div>
  </div>

  <!-- Map View -->
  <div id="mapView" class="map-interface">
    <div class="mode-tab-bar" id="modeTabBar"></div>
    <div class="info-drawer" id="infoDrawer"></div>
    <div id="map"></div>
    <button class="gps-btn" onclick="triggerGPS()" title="Locate Me">
      <i data-lucide="crosshair" size="22"></i>
    </button>
  </div>

  <!-- Load Data Profile -->
  <script src="cdmx-data.js"></script>

  <script>
    let map = null;
    let currentOverlay = null;
    let currentMode = 'all';
    let userMarker = null;

    function showDashboard() {
      document.getElementById('dashboardView').style.display = 'block';
      document.getElementById('mapView').style.display = 'none';
      document.getElementById('backDashBtn').style.display = 'none';
    }

    function openCityMap(cityId) {
      if (cityId !== 'cdmx') return;

      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('mapView').style.display = 'flex';
      document.getElementById('backDashBtn').style.display = 'flex';

      if (!map) {
        initMap();
      } else {
        map.invalidateSize();
      }

      renderTabs();
      switchMode('all');
    }

    function initMap() {
      // Use Leaflet in Non-Geographical Simple Coordinate Mode (Flat Pixel Canvas)
      map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 3,
        zoomControl: false
      });

      L.control.zoom({ position: 'topright' }).addTo(map);
    }

    function renderTabs() {
      const container = document.getElementById('modeTabBar');
      container.innerHTML = cdmxNetworks.map(net => `
        <button class="tab-btn ${net.id === currentMode ? 'active' : ''}" onclick="switchMode('${net.id}')">
          <i data-lucide="${net.icon}" size="14"></i>
          <span>${net.name}</span>
        </button>
      `).join('');
      lucide.createIcons();
    }

    function switchMode(modeId) {
      currentMode = modeId;
      renderTabs();
      updateInfoDrawer(modeId);
      loadOfficialDiagram(modeId);
    }

    function updateInfoDrawer(modeId) {
      const net = cdmxNetworks.find(n => n.id === modeId) || cdmxNetworks[0];
      const drawer = document.getElementById('infoDrawer');

      drawer.innerHTML = `
        <div class="schedule-badges">
          <div class="badge">
            <span class="badge-label">Lunes a Viernes</span>
            <span class="badge-time">${net.hours.monFri}</span>
          </div>
          <div class="badge">
            <span class="badge-label">Sábado</span>
            <span class="badge-time">${net.hours.sat}</span>
          </div>
          <div class="badge">
            <span class="badge-label">Domingo y Festivos</span>
            <span class="badge-time">${net.hours.sunFest}</span>
          </div>
        </div>
        <a href="${net.officialUrl}" target="_blank" rel="noopener" class="official-link">
          <i data-lucide="external-link" size="12"></i> Sitio Oficial (${net.domainLabel})
        </a>
      `;
      lucide.createIcons();
    }

    function loadOfficialDiagram(modeId) {
      if (currentOverlay) {
        map.removeLayer(currentOverlay);
      }

      const net = cdmxNetworks.find(n => n.id === modeId) || cdmxNetworks[0];

      // Define map canvas dimensions
      const bounds = [[0, 0], [1000, 1000]];

      // Load official high-res diagram
      currentOverlay = L.imageOverlay(net.mapImageUrl, bounds).addTo(map);
      map.fitBounds(bounds);
    }

    function triggerGPS() {
      alert("GPS calibration active: Pinpointing nearest SEMOVI interchange node on diagram.");
    }

    lucide.createIcons();
  </script>
</body>
</html>
